<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Boshka Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:wght@300;400;600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #d4a853;
  --gold-light: #f5d08a;
  --gold-dim: rgba(212,168,83,0.15);
  --cream: #f5efe4;
  --deep: #0c0a06;
  --bark: #1a120a;
  --moss: #1e2b0f;
  --leaf: #3a5c1a;
  --sage: #7aab4a;
  --ember: #c44a1a;
  --warm-white: rgba(245,239,228,0.9);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background: var(--deep);
  font-family: 'Josefin Sans', sans-serif;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

/* ── Noise texture overlay ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
  opacity: 0.6;
}

.page {
  width: 100%;
  max-width: 460px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse 100% 50% at 50% 0%, #2a3d12 0%, transparent 60%),
    radial-gradient(ellipse 80% 40% at 0% 60%, #1a0d06 0%, transparent 55%),
    radial-gradient(ellipse 80% 40% at 100% 40%, #1a0d06 0%, transparent 55%),
    radial-gradient(ellipse 100% 50% at 50% 100%, #1a0900 0%, transparent 60%),
    linear-gradient(170deg, #0f1a06 0%, #0c0a06 40%, #110600 100%);
}

/* ── Animated fireflies ── */
.fireflies {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}
.ff {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 6px 2px rgba(245,208,138,0.6);
  animation: float var(--dur, 8s) ease-in-out infinite var(--delay, 0s);
  opacity: 0;
}
@keyframes float {
  0%   { opacity:0; transform: translate(0,0) scale(0.5); }
  20%  { opacity:0.9; }
  80%  { opacity:0.7; }
  100% { opacity:0; transform: translate(var(--tx,20px), var(--ty,-80px)) scale(1); }
}

/* ── Botanical SVG frame ── */
.frame {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}

/* ── Gold line top ── */
.top-rule {
  width: calc(100% - 48px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
  margin-top: 20px;
  position: relative;
  z-index: 10;
  animation: fadeIn 1s ease both;
  opacity: 0.5;
}

/* ── Header ── */
.header {
  width: 100%;
  text-align: center;
  padding: 28px 28px 10px;
  position: relative;
  z-index: 10;
  animation: riseUp 0.9s cubic-bezier(0.22,1,0.36,1) both;
}

.logo-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}

.logo-wrap img {
  width: 200px;
  max-width: 80%;
  filter: drop-shadow(0 0 24px rgba(212,168,83,0.35)) drop-shadow(0 4px 12px rgba(0,0,0,0.8));
}

.brand-name {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--gold-light);
  text-transform: uppercase;
  text-shadow: 0 0 40px rgba(212,168,83,0.4), 0 2px 4px rgba(0,0,0,0.8);
  line-height: 1;
  margin-bottom: 4px;
}

.brand-arabic {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  color: rgba(245,208,138,0.7);
  direction: rtl;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.tagline {
  font-size: 9px;
  color: rgba(212,168,83,0.5);
  letter-spacing: 5px;
  text-transform: uppercase;
  font-weight: 600;
}

/* ── Ornamental divider ── */
.ornament {
  display: flex;
  align-items: center;
  gap: 12px;
  width: calc(100% - 56px);
  margin: 16px auto 20px;
  position: relative;
  z-index: 10;
  animation: fadeIn 1s 0.3s ease both;
  opacity: 0;
}
.orn-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,168,83,0.45), transparent);
}
.orn-diamond {
  width: 6px;
  height: 6px;
  border: 1px solid var(--gold);
  transform: rotate(45deg);
  opacity: 0.7;
}
.orn-center {
  font-size: 18px;
  line-height: 1;
}

/* ── Button grid ── */
.grid {
  width: 100%;
  padding: 0 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 10;
  animation: riseUp 0.9s 0.2s cubic-bezier(0.22,1,0.36,1) both;
}

.row { display: flex; gap: 12px; width: 100%; }

/* ── Base button ── */
.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  text-decoration: none;
  border-radius: 16px;
  padding: 22px 16px;
  position: relative;
  overflow: hidden;
  flex: 1;
  gap: 9px;
  border: none;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s ease;
  isolation: isolate;
}

/* Shimmer effect */
.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.5s ease;
}
.btn:hover::before { transform: translateX(100%); }
.btn:hover { transform: translateY(-5px) scale(1.02); }
.btn:active { transform: scale(0.97) translateY(0); }

/* Top gloss line */
.btn::after {
  content: '';
  position: absolute;
  top: 0; left: 12px; right: 12px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}

/* ── Order button (hero) ── */
.btn-menu {
  min-height: 150px;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,180,60,0.2) 0%, transparent 60%),
    linear-gradient(145deg, #3d1c00, #c4620a 45%, #3d1c00);
  border: 1.5px solid rgba(255,160,60,0.5);
  box-shadow:
    0 12px 40px rgba(180,80,0,0.5),
    0 0 0 1px rgba(255,140,40,0.1),
    inset 0 1px 0 rgba(255,200,100,0.2);
}
.btn-menu:hover {
  box-shadow: 0 20px 50px rgba(200,90,0,0.6), 0 0 30px rgba(200,100,0,0.25), inset 0 1px 0 rgba(255,200,100,0.3);
}

/* ── Facebook ── */
.btn-fb {
  min-height: 130px;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(100,200,60,0.15) 0%, transparent 60%),
    linear-gradient(145deg, #0d3605, #2a8c12 45%, #0d3605);
  border: 1.5px solid rgba(80,180,40,0.45);
  box-shadow:
    0 10px 32px rgba(30,120,10,0.5),
    inset 0 1px 0 rgba(150,240,80,0.15);
}
.btn-fb:hover {
  box-shadow: 0 18px 44px rgba(30,130,10,0.6), 0 0 24px rgba(60,180,20,0.2), inset 0 1px 0 rgba(150,240,80,0.25);
}

/* ── Instagram ── */
.btn-ig {
  min-height: 130px;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,120,60,0.15) 0%, transparent 60%),
    linear-gradient(145deg, #4a1000, #d43c08 45%, #4a1000);
  border: 1.5px solid rgba(255,100,40,0.45);
  box-shadow:
    0 10px 32px rgba(200,50,10,0.5),
    inset 0 1px 0 rgba(255,160,80,0.15);
}
.btn-ig:hover {
  box-shadow: 0 18px 44px rgba(210,60,10,0.6), 0 0 24px rgba(255,80,20,0.2), inset 0 1px 0 rgba(255,160,80,0.25);
}

/* ── Google Maps / Review ── */
.btn-maps {
  min-height: 130px;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(220,180,0,0.15) 0%, transparent 60%),
    linear-gradient(145deg, #3a2c00, #b89000 45%, #3a2c00);
  border: 1.5px solid rgba(220,180,0,0.45);
  box-shadow:
    0 10px 32px rgba(160,130,0,0.5),
    inset 0 1px 0 rgba(255,240,100,0.15);
}
.btn-maps:hover {
  box-shadow: 0 18px 44px rgba(170,140,0,0.6), 0 0 24px rgba(220,180,0,0.2), inset 0 1px 0 rgba(255,240,100,0.25);
}

.btn-icon {
  font-size: 36px;
  line-height: 1;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}
.btn-icon svg {
  width: 40px; height: 40px;
  display: block;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}

.btn-label {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  letter-spacing: 0.5px;
}
.btn-menu .btn-label { font-size: 22px; letter-spacing: 1px; }

.btn-hint {
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  font-weight: 300;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ── Share / copy section ── */
.share-section {
  width: 100%;
  padding: 0 18px;
  margin-top: 18px;
  position: relative;
  z-index: 10;
  animation: riseUp 0.9s 0.35s cubic-bezier(0.22,1,0.36,1) both;
}

.share-card {
  background: rgba(212,168,83,0.05);
  border: 1px solid rgba(212,168,83,0.2);
  border-radius: 16px;
  padding: 22px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Corner accents */
.share-card::before,
.share-card::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-color: rgba(212,168,83,0.4);
  border-style: solid;
}
.share-card::before { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
.share-card::after  { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

.share-title {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-style: italic;
  color: var(--gold-light);
  margin-bottom: 3px;
  letter-spacing: 1px;
}
.share-sub {
  font-size: 10px;
  color: rgba(212,168,83,0.5);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 30px;
  background: linear-gradient(135deg, #c4901a, var(--gold), #c4901a);
  background-size: 200% 100%;
  border: none;
  border-radius: 50px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #1a0e00;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(180,130,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: all 0.3s ease;
  background-position: 0% 50%;
}
.copy-btn:hover {
  background-position: 100% 50%;
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(180,130,0,0.55);
}
.copy-btn:active { transform: scale(0.97); }

.copy-msg {
  margin-top: 12px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--sage);
  opacity: 0;
  transition: opacity 0.4s ease;
  text-transform: uppercase;
}

/* ── Footer ── */
.footer {
  text-align: center;
  padding: 20px 20px 44px;
  font-size: 10px;
  color: rgba(212,168,83,0.3);
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  position: relative;
  z-index: 10;
  animation: fadeIn 1s 0.5s ease both;
  opacity: 0;
}

/* ── Keyframes ── */
@keyframes riseUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
</style>
</head>

<script>
// Fireflies
(function(){
  var wrap = document.getElementById('fireflies');
  for(var i = 0; i < 18; i++){
    var d = document.createElement('div');
    d.className = 'ff';
    var x = Math.random()*100;
    var y = 20 + Math.random()*80;
    d.style.cssText = [
      'left:'+x+'%',
      'top:'+y+'%',
      '--dur:'+(6+Math.random()*8)+'s',
      '--delay:'+(Math.random()*10)+'s',
      '--tx:'+(Math.random()*60-30)+'px',
      '--ty:'+(-40-Math.random()*80)+'px',
      'width:'+(2+Math.random()*2)+'px',
      'height:'+(2+Math.random()*2)+'px',
    ].join(';');
    wrap.appendChild(d);
  }
})();

// Copy link
function copyLink(){
  var url = "https://boshkagrandcafe.github.io/official/";
  var msg = document.getElementById('copyMsg');
  function show(){
    msg.style.opacity='1';
    setTimeout(function(){ msg.style.opacity='0'; }, 2500);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(show).catch(fb);
  } else { fb(); }
  function fb(){
    var t = document.createElement('textarea');
    t.value = url; t.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); show(); } catch(e){}
    document.body.removeChild(t);
  }
}
</script>
